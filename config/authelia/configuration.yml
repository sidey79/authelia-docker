theme: auto

default_2fa_method: totp

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

certificates_directory: /certificates

identity_validation:
  reset_password: {}

authentication_backend:
  file:
    path: /run/authelia-secrets/users_database.yml

webauthn:
  enable_passkey_login: true
  selection_criteria:
    discoverability: preferred
    user_verification: preferred

access_control:
  default_policy: deny
  rules:
    - domain: "dms.sidey.blausee.eu"
      subject: "group:paperless-users"
      policy: one_factor
    - domain: "dms.sidey.blausee.eu"
      policy: deny
    - domain: "*.sidey.blausee.eu"
      policy: one_factor

session:
  name: authelia_session
  cookies:
    - name: authelia_session
      domain: sidey.blausee.eu
      authelia_url: https://auth.sidey.blausee.eu
      default_redirection_url: https://workflow.sidey.blausee.eu
  redis:
    host: redis
    port: 6379

storage:
  postgres:
    address: tcp://postgresql:5432
    database: authelia
    username: authelia

notifier:
  smtp:
    subject: "[Authelia] {title}"
