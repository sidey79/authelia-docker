theme: auto

default_2fa_method: totp

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

certificates_directory: /certificates

identity_validation:
  reset_password: {}

authentication_backend:
  file:
    path: /run/authelia-secrets/users_database.yml

webauthn:
  enable_passkey_login: true
  selection_criteria:
    discoverability: preferred
    user_verification: preferred

definitions:
  user_attributes:
    vaultwarden_roles:
      expression: '"vaultwarden-admins" in groups ? ["admin"] : "vaultwarden-users" in groups ? ["user"] : [""]'

identity_providers:
  oidc:
    jwks:
      - key: {{ secret "/run/authelia-secrets/oidc_jwks_rsa_private_key.pem" | mindent 10 "|" | msquote }}
    claims_policies:
      vaultwarden:
        id_token:
          - vaultwarden_roles
        custom_claims:
          vaultwarden_roles: {}
    scopes:
      vaultwarden:
        claims:
          - vaultwarden_roles
    clients:
      - client_id: vaultwarden
        client_name: Vaultwarden
        client_secret: {{ secret "/run/authelia-secrets/vaultwarden_oidc_client_secret_digest" | msquote }}
        public: false
        authorization_policy: two_factor
        require_pkce: true
        pkce_challenge_method: S256
        claims_policy: vaultwarden
        redirect_uris:
          - https://bitwarden.sidey.blausee.eu/identity/connect/oidc-signin
        scopes:
          - openid
          - offline_access
          - profile
          - email
          - vaultwarden
        response_types:
          - code
        grant_types:
          - authorization_code
          - refresh_token
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic

access_control:
  default_policy: deny
  rules:
    - domain: "dms.sidey.blausee.eu"
      subject: "group:paperless-users"
      policy: one_factor
    - domain: "dms.sidey.blausee.eu"
      policy: deny
    - domain: "bitwarden.sidey.blausee.eu"
      policy: two_factor
    - domain: "fhem.sidey.blausee.eu"
      subject: "group:fhem-users"
      policy: two_factor
    - domain: "fhem.sidey.blausee.eu"
      policy: deny
    - domain: "*.sidey.blausee.eu"
      policy: one_factor

session:
  name: authelia_session
  cookies:
    - name: authelia_session
      domain: sidey.blausee.eu
      authelia_url: https://auth.sidey.blausee.eu
      default_redirection_url: https://landing.sidey.blausee.eu
  redis:
    host: redis
    port: 6379

storage:
  postgres:
    address: tcp://postgresql:5432
    database: authelia
    username: authelia

notifier:
  smtp:
    subject: "[Authelia Blausee] {title}"
